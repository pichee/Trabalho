services:
  hidroreader:
    build: .
    container_name: hidroreader_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persistência do banco de dados, uploads e modelos no host
      - ./hidroreader.db:/app/hidroreader.db
      - ./uploads:/app/uploads
      - ./modelos_ia:/app/modelos_ia
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
