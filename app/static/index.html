<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b4f6c">
    <title>HidroReader - Leitor de Hidrômetro</title>
    <link rel="stylesheet" href="/static/css/mobile2.css?v=3">
</head>
<body>
    <header>
        <div class="header-brand">
            <h1>
                <svg class="icon-inline" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 3.2C12 3.2 6.5 9.6 6.5 14C6.5 17.0376 8.96243 19.5 12 19.5C15.0376 19.5 17.5 17.0376 17.5 14C17.5 9.6 12 3.2 12 3.2Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                HidroReader
            </h1>
            <p>Leitor de Hidrômetros Mobile</p>
        </div>
        <div class="header-user">
            <span id="user-display" class="user-badge">
                <svg class="icon-inline-sm" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M5.5 19.5C5.5 16.4624 8.41015 14 12 14C15.5899 14 18.5 16.4624 18.5 19.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span id="user-name-text">Administrador</span>
            </span>
            <button id="btn-logout" class="btn-logout">Sair</button>
        </div>
    </header>

    <main>
        <!-- 1. SELETOR DE APARTAMENTO -->
        <div class="apartment-card">
            <label for="select-apartamento">
                <svg class="icon-inline-sm" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="5" y="3.5" width="14" height="17" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M9 7.5H10.5M13.5 7.5H15M9 11.5H10.5M13.5 11.5H15M9 15.5H10.5M13.5 15.5H15M10.5 20.5V18H13.5V20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                Selecionar Apartamento:
            </label>
            <div class="apartment-row">
                <select id="select-apartamento">
                    <option value="">-- Carregando Apartamentos --</option>
                </select>
                <button type="button" id="btn-add-apto" class="btn-icon-add" title="Cadastrar novo apartamento">+</button>
            </div>
        </div>

        <input type="file" id="file-input" accept="image/*" style="display: none;">

        <!-- 2. CARD DE CÂMERA -->
        <div class="camera-card" id="camera-card">
            <img id="preview-img" alt="Foto capturada">
            <div class="placeholder-view" id="placeholder-view">
                <div class="placeholder-icon">
                    <svg class="icon-placeholder" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M4 8V6C4 4.89543 4.89543 4 6 4H8M16 4H18C19.1046 4 20 4.89543 20 6V8M20 16V18C20 19.1046 19.1046 20 18 20H16M8 20H6C4.89543 20 4 19.1046 4 18V16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                        <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/>
                    </svg>
                </div>
                <p>Selecione o apartamento acima e capture a foto do hidrômetro</p>
            </div>
            <div class="loading-spinner" id="loading-view">
                <div class="spinner"></div>
                <p>Processando imagem com IA...</p>
            </div>
        </div>

        <!-- 3. AÇÕES -->
        <div class="actions-grid">
            <button class="btn btn-secondary btn-icon-only" id="btn-camera" aria-label="Tirar Foto" title="Tirar Foto">
                <svg class="icon-action" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M4 8.5C4 7.39543 4.89543 6.5 6 6.5H7.6C8.15 6.5 8.66 6.22 8.95 5.75L9.7 4.55C10.02 4.03 10.59 3.7 11.2 3.7H12.8C13.41 3.7 13.98 4.03 14.3 4.55L15.05 5.75C15.34 6.22 15.85 6.5 16.4 6.5H18C19.1046 6.5 20 7.39543 20 8.5V17.5C20 18.6046 19.1046 19.5 18 19.5H6C4.89543 19.5 4 18.6046 4 17.5V8.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="13" r="3.5" stroke="currentColor" stroke-width="1.8"/>
                </svg>
            </button>
            <button class="btn btn-secondary btn-icon-only" id="btn-gallery" aria-label="Galeria" title="Galeria">
                <svg class="icon-action" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect x="4" y="4.5" width="16" height="15" rx="2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="9" cy="9.5" r="1.4" fill="currentColor"/>
                    <path d="M4.5 17L9.2 12.6C9.75 12.08 10.62 12.1 11.15 12.64L13.5 15L15.6 13.1C16.14 12.61 16.97 12.63 17.48 13.15L19.5 15.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="btn btn-primary" id="btn-process" disabled>Ler e Salvar Medição</button>
        </div>

        <!-- 4. RESULTADO -->
        <div class="result-card" id="result-card">
            <div class="reading-banner">
                <div id="reading-apto" class="reading-apto-badge">Apartamento 101</div>
                <div class="reading-label">Leitura Identificada</div>
                <div class="reading-val" id="reading-val">------</div>
                <div class="reading-meta" id="reading-meta">Aguardando...</div>
            </div>

            <div class="digits-grid" id="digits-container"></div>
            <div class="alert-box" id="alerts-container" style="display: none;"></div>
        </div>
    </main>

    <script src="/static/js/app.js?v=2"></script>
</body>
</html>
