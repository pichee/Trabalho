<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>Login - HidroReader</title>
    <link rel="stylesheet" href="/static/css/mobile.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-header">
            <div class="app-logo">💧</div>
            <h1>HidroReader</h1>
            <p>Sistema de Leitura de Hidrômetros Mobile</p>
        </div>

        <div class="login-card">
            <h2>Acessar Conta</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="usuario">Usuário / Operador</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="senha">Senha de Acesso</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••" required autocomplete="current-password">
                </div>

                <div id="login-error" class="login-error" style="display: none;"></div>

                <button type="submit" class="btn btn-primary" id="btn-login">
                    <span>Entrar no Aplicativo</span>
                </button>
            </form>

            <div class="login-hint">
                <small>💡 Usuários de demonstração:</small>
                <code>admin / admin</code> ou <code>operador / 123456</code>
            </div>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
