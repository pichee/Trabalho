<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Login - HidroReader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/mobile.css?v=3.1" />
</head>
<body class="page-container">

  <main class="phone-frame">
    <!-- Cabeçalho com Padrão Geométrico Bauhaus em SVG + Logo -->
    <header class="header-area">
      <svg class="pattern-bg" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <rect width="400" height="280" fill="#080808"/>
        <!-- Formas geométricas Bauhaus -->
        <g fill="#161616">
          <circle cx="40" cy="40" r="40" />
          <path d="M 0,80 A 80,80 0 0,1 80,160 L 0,160 Z" />
          <polygon points="0,160 80,160 40,200 80,240 0,240" />
          <circle cx="40" cy="260" r="28" />
          
          <path d="M 80,0 L 160,0 A 80,80 0 0,1 80,80 Z" />
          <circle cx="120" cy="120" r="36" />
          <polygon points="80,160 160,160 160,240" />
          <path d="M 80,240 A 40,40 0 0,1 160,240 Z" />

          <polygon points="160,0 240,0 200,40 240,80 160,80" />
          <path d="M 160,160 L 240,80 L 240,160 Z" />
          <circle cx="200" cy="200" r="40" />

          <circle cx="280" cy="40" r="40" />
          <path d="M 240,80 L 320,80 L 280,120 L 320,160 L 240,160 Z" />
          <path d="M 240,160 A 80,80 0 0,1 320,240 L 240,240 Z" />

          <path d="M 320,0 A 80,80 0 0,0 400,80 L 400,0 Z" />
          <circle cx="360" cy="120" r="40" />
          <polygon points="320,160 400,160 360,200 400,240 320,240" />
          <circle cx="360" cy="265" r="25" />
        </g>
      </svg>

      <!-- Logo estilizada gota/hidrômetro com corte assimétrico -->
      <div class="brand-logo" aria-label="HidroReader Logo">
        <div class="brand-logo-inner"></div>
      </div>
      <div class="brand-subtext">HidroReader Mobile</div>
    </header>

    <!-- Folha sobreposta com canto arredondado clássico -->
    <section class="login-sheet">
      <h1 class="login-title">Acessar Conta</h1>

      <form class="login-form" id="loginForm">
        <label class="input-box" for="usuario">
          <span class="input-label">Usuário ou E-mail</span>
          <div class="input-wrapper">
            <input
              type="text"
              id="usuario"
              name="usuario"
              class="input-field"
              placeholder="admin ou operador"
              value="admin"
              required
              autocomplete="username"
            />
          </div>
        </label>

        <label class="input-box" for="senha">
          <span class="input-label">Senha</span>
          <div class="input-wrapper">
            <input
              type="password"
              id="senha"
              name="senha"
              class="input-field"
              placeholder="••••••••"
              value="admin"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Mostrar ou ocultar senha"
              title="Mostrar/ocultar senha"
            >
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </label>

        <div id="login-error" class="error-banner" style="display: none;"></div>

        <button type="submit" class="btn-action-primary" id="btnSubmit">
          <span id="btnText">Entrar</span>
        </button>

        <!-- Atalhos rápidos para demo -->
        <div class="demo-pills">
          <span class="demo-label">Contas de teste:</span>
          <div class="pills-row">
            <button type="button" class="pill-btn" onclick="preencherLogin('admin', 'admin')">Admin</button>
            <button type="button" class="pill-btn" onclick="preencherLogin('operador', '123456')">Operador</button>
          </div>
        </div>
      </form>

      <div class="footer-links">
        HidroReader AI • Leitura Inteligente de Hidrômetros
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/static/js/login.js"></script>
</body>
</html>
